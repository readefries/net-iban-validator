on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - main
permissions:
  id-token: write  # enable GitHub OIDC token issuance for this job

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 7.0.

      - name: NuGet OIDC login
        uses: NuGet/login@v1
        id: login
        with:
          user: cloudcosmonaut

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: dotnet nuget push ./IbanValidator/bin/Release/cloudcosmonaut.ibanvalidator.*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
