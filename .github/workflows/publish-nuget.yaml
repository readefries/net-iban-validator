on:
  push:
    branches:
      - main

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Create GitHub release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v8.0.1
        with:
          semantic_version: 24.2.9
          branches: '["main"]'
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: NuGet OIDC login
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: cloudcosmonaut

      - name: Pack NuGet package
        if: steps.semantic-release.outputs.new_release_published == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        run: dotnet pack IbanValidator/IbanValidator.csproj --configuration Release --no-build --output ./artifacts -p:PackageVersion="$PACKAGE_VERSION"

      - name: Publish
        if: steps.semantic-release.outputs.new_release_published == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/cloudcosmonaut.ibanvalidator.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
