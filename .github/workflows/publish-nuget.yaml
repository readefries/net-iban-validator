on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

  publish-nuget:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Verify release baseline
        run: |
          if ! git tag --list | grep -Fxq 'v1.0.9'; then
            echo "::error::Create the initial v1.0.9 GitHub release at the last commit containing package version 1.0.9 before enabling automated releases."
            exit 1
          fi

      - name: Create GitHub release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v8.0.1
        with:
          semantic_version: 24.2.9
          branches: '["main"]'
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: NuGet OIDC login
        if: steps.semantic-release.outputs.new_release_published == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: cloudcosmonaut

      - name: Pack NuGet package
        if: steps.semantic-release.outputs.new_release_published == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        run: dotnet pack IbanValidator/IbanValidator.csproj --configuration Release --no-build --output ./artifacts -p:PackageVersion="$PACKAGE_VERSION"

      - name: Publish
        if: steps.semantic-release.outputs.new_release_published == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/cloudcosmonaut.ibanvalidator.$PACKAGE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
